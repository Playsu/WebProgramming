<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Information</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="card" aria-labelledby="page-title">
      <div class="card__intro">
        <p class="eyebrow">Welcome</p>
        <h1 id="page-title">Tell us about yourself</h1>
        <p class="intro-text">Please fill in your personal information below.</p>
      </div>

      <form class="profile-form" id="profile-form" action="#" method="post">
        <div class="form-row">
          <div class="form-group">
            <label for="first-name">First name</label>
            <input type="text" id="first-name" name="first_name" autocomplete="given-name" placeholder="Enter your first name" required>
          </div>

          <div class="form-group">
            <label for="last-name">Last name</label>
            <input type="text" id="last-name" name="last_name" autocomplete="family-name" placeholder="Enter your last name" required>
          </div>
        </div>

        <div class="form-group">
          <label for="date-of-birth">Date of birth</label>
          <input type="text" id="date-of-birth" name="date_of_birth" autocomplete="bday" placeholder="dd/mm/yyyy" pattern="\d{2}/\d{2}/\d{4}" title="Please use the format dd/mm/yyyy" inputmode="numeric" required>
        </div>

        <div class="form-group">
          <label for="gender">Gender</label>
          <select id="gender" name="gender" required>
            <option value="" selected disabled>Select your gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="prefer-not-to-say">Prefer not to say</option>
          </select>
        </div>

        <div class="form-group">
          <label for="country">Country</label>
          <input type="text" id="country" name="country" autocomplete="country-name" placeholder="Write your country" required>
        </div>

        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="phone">Phone number</label>
          <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="+1 555 123 4567" required>
        </div>

        <button type="submit">Submit information</button>
      </form>
      <div class="summary" id="summary" role="status" aria-live="polite" hidden>
        <p class="eyebrow">All set</p>
        <h2 tabindex="-1">Your information</h2>
        <p class="summary__intro">Thank you for sharing your details. Please review your submission below.</p>
        <dl class="summary__list">
          <div><dt>Name</dt><dd id="summary-name"></dd></div>
          <div><dt>Date of birth</dt><dd id="summary-date"></dd></div>
          <div><dt>Gender</dt><dd id="summary-gender"></dd></div>
          <div><dt>Country</dt><dd id="summary-country"></dd></div>
          <div><dt>Email</dt><dd id="summary-email"></dd></div>
          <div><dt>Phone</dt><dd id="summary-phone"></dd></div>
        </dl>
      </div>
    </section>
  </main>
  <script>
    const profileForm = document.getElementById('profile-form');
    const summary = document.getElementById('summary');
    const genderLabels = {
      male: 'Male',
      female: 'Female',
      'prefer-not-to-say': 'Prefer not to say'
    };

    profileForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const formData = new FormData(profileForm);
      document.getElementById('summary-name').textContent =
        `${formData.get('first_name')} ${formData.get('last_name')}`;
      document.getElementById('summary-date').textContent = formData.get('date_of_birth');
      document.getElementById('summary-gender').textContent = genderLabels[formData.get('gender')];
      document.getElementById('summary-country').textContent = formData.get('country');
      document.getElementById('summary-email').textContent = formData.get('email');
      document.getElementById('summary-phone').textContent = formData.get('phone');
      profileForm.hidden = true;
      summary.hidden = false;
      summary.querySelector('h2').focus();
    });
  </script>
</body>
</html>
