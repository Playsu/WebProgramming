<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Information</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="card" aria-labelledby="page-title">
      <div class="card__intro">
        <p class="eyebrow">Welcome</p>
        <h1 id="page-title">Tell us about yourself</h1>
        <p class="intro-text">Please fill in your personal information below.</p>
      </div>

      <form class="profile-form" action="#" method="post">
        <div class="form-row">
          <div class="form-group">
            <label for="first-name">First name</label>
            <input type="text" id="first-name" name="first_name" autocomplete="given-name" placeholder="Enter your first name" required>
          </div>

          <div class="form-group">
            <label for="last-name">Last name</label>
            <input type="text" id="last-name" name="last_name" autocomplete="family-name" placeholder="Enter your last name" required>
          </div>
        </div>

        <div class="form-group">
          <label for="date-of-birth">Date of birth</label>
          <input type="date" id="date-of-birth" name="date_of_birth" autocomplete="bday" required>
        </div>

        <div class="form-group">
          <label for="country">Country</label>
          <select id="country" name="country" autocomplete="country-name" required>
            <option value="" selected disabled>Select your country</option>
            <option value="canada">Canada</option>
            <option value="france">France</option>
            <option value="germany">Germany</option>
            <option value="italy">Italy</option>
            <option value="japan">Japan</option>
            <option value="spain">Spain</option>
            <option value="uk">United Kingdom</option>
            <option value="usa">United States</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required>
        </div>

        <button type="submit">Submit information</button>
      </form>
    </section>
  </main>
</body>
</html>
