<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Information</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="card" aria-labelledby="page-title">
      <div class="card__intro">
        <p class="eyebrow">Welcome</p>
        <h1 id="page-title">Tell us about yourself</h1>
        <p class="intro-text">Please fill in your personal information below.</p>
      </div>

      <form class="profile-form" id="profile-form" action="#" method="post">
        <div class="form-row">
          <div class="form-group">
            <label for="first-name">First name</label>
            <input type="text" id="first-name" name="first_name" autocomplete="given-name" placeholder="Enter your first name" required>
          </div>

          <div class="form-group">
            <label for="last-name">Last name</label>
            <input type="text" id="last-name" name="last_name" autocomplete="family-name" placeholder="Enter your last name" required>
          </div>
        </div>

        <div class="form-group">
          <label for="date-of-birth">Date of birth</label>
          <input type="text" id="date-of-birth" name="date_of_birth" autocomplete="bday" placeholder="dd/mm/yyyy" pattern="\d{2}/\d{2}/\d{4}" title="Please use the format dd/mm/yyyy" inputmode="numeric" required>
        </div>

        <div class="form-group">
          <label for="gender">Gender</label>
          <select id="gender" name="gender" required>
            <option value="" selected disabled>Select your gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="prefer-not-to-say">Prefer not to say</option>
          </select>
        </div>

        <div class="form-group">
          <label for="country">Country</label>
          <input type="text" id="country" name="country" autocomplete="country-name" placeholder="Write your country" required>
        </div>

        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required>
        </div>

        <button type="submit">Submit information</button>
      </form>
      <p class="success-message" id="success-message" role="status" aria-live="polite" hidden>
        Thank you! Your information has been submitted successfully.
      </p>
    </section>
  </main>
  <script>
    const profileForm = document.getElementById('profile-form');
    const successMessage = document.getElementById('success-message');

    profileForm.addEventListener('submit', (event) => {
      event.preventDefault();
      successMessage.hidden = false;
      profileForm.hidden = true;
      successMessage.focus();
    });
  </script>
</body>
</html>
